<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kichikalloma Ai</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      /* Oq va iliq sariq bolalar mavzusi */
      --bg-light: #fffdf5;
      --bg-gradient: linear-gradient(180deg, #fffbeb 0%, #ffffff 100%);
      --card-ai-bg: #fefce8;
      --card-ai-border: #fef08a;
      --user-bubble-bg: #f59e0b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --mic-glow: rgba(245, 158, 11, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-color: var(--bg-light);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation (Oq va sariq dizayn) */
    .top-nav {
      position: relative;
      background: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #fef08a;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.08);
      z-index: 10;
      min-height: 60px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      z-index: 2;
    }

    .nav-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .nav-logo {
      height: 44px;
      object-fit: contain;
      display: block;
      /* Mutlaqo qimirlamasdan joyida qotib turadi! */
      animation: none !important;
      transform: none !important;
      filter: none !important;
    }

    /* Ovoz to'xtatish tugmasi */
    .speaking-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 3;
      margin-left: auto;
      margin-right: 6px;
    }

    .speaking-indicator.active {
      display: flex;
    }

    /* Chat Messages Container */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Message Row */
    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .ai-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fde047, #f59e0b, #b45309);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
      position: relative;
    }

    .ai-avatar::after {
      content: '';
      position: absolute;
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      bottom: 0;
      right: 0;
      border: 2px solid #ffffff;
    }

    /* Message Bubbles */
    .bubble {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
    }

    .ai-bubble {
      background: var(--card-ai-bg);
      color: #1e293b;
      border: 1.5px solid var(--card-ai-border);
      border-top-left-radius: 6px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.06);
    }

    .user-bubble {
      background: var(--user-bubble-bg);
      color: #ffffff;
      border-top-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
      font-weight: 500;
    }

    .bubble-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .action-icon-btn {
      background: #fef08a;
      border: 1px solid #fde047;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b45309;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-icon-btn:active {
      transform: scale(0.9);
      background: #fde047;
    }

    .action-icon-btn.playing {
      background: #fee2e2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    .translation-box {
      margin-top: 8px;
      padding: 8px 12px;
      background: #ffffff;
      border-left: 3px solid #f59e0b;
      border-radius: 6px;
      font-size: 13.5px;
      color: #78350f;
      display: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .translation-box.show {
      display: block;
    }

    /* Sound Waves animation */
    .wave-bars {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 20px;
    }

    .wave-bars.active {
      display: flex;
    }

    .bar {
      width: 4px;
      height: 8px;
      background: #f59e0b;
      border-radius: 2px;
      animation: soundWave 0.8s infinite ease-in-out alternate;
    }

    .bar:nth-child(2) { animation-delay: 0.15s; height: 16px; }
    .bar:nth-child(3) { animation-delay: 0.3s; height: 22px; }
    .bar:nth-child(4) { animation-delay: 0.45s; height: 14px; }
    .bar:nth-child(5) { animation-delay: 0.6s; height: 8px; }

    @keyframes soundWave {
      0% { height: 6px; }
      100% { height: 22px; background: #fbbf24; }
    }

    /* Bottom Control Bar */
    .bottom-bar {
      background: #ffffff;
      border-top: 2px solid #fef08a;
      padding: 8px 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 -4px 14px rgba(245, 158, 11, 0.05);
      z-index: 10;
    }

    /* Quick Chips (Tezkor tanlov tugmachalari) */
    .chips-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      padding: 4px 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .chips-container::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #fef9c3;
      border: 1.5px solid #fde047;
      color: #92400e;
      padding: 6px 13px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .chip:active {
      transform: scale(0.94);
      background: #fef08a;
    }

    /* Mikrofon bo'limi */
    .mic-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mic-button-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
    }

    .mic-pulse-ring {
      position: absolute;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--mic-glow);
      opacity: 0;
      pointer-events: none;
    }

    .mic-pulse-ring.active {
      animation: pulseAnim 1.4s infinite;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .mic-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      transition: transform 0.15s;
    }

    .mic-btn.recording {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
      animation: pulseRecord 1.2s infinite;
    }

    @keyframes pulseRecord {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .mic-btn svg {
      width: 38px;
      height: 38px;
      fill: currentColor;
    }

    .mic-status-label {
      font-size: 14px;
      color: #78350f;
      font-weight: 700;
      text-align: center;
      min-height: 20px;
    }

    /* Matn kiritish qatori */
    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      align-items: center;
      padding-top: 2px;
    }

    .input-row input {
      flex: 1;
      border: 1.5px solid #fef08a;
      background: #fffdf5;
      border-radius: 22px;
      padding: 9px 15px;
      font-size: 14.5px;
      color: #1e293b;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #f59e0b;
      background: #ffffff;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.3);
      transition: transform 0.1s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Top Navigation (Oq va sariq dizayn) -->
  <div class="top-nav">
    <button class="nav-btn" onclick="handleBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="nav-title">
      <img src="kichikalloma-logo.png" alt="Kichik Alloma" class="nav-logo">
    </div>

    <!-- Ovoz to'xtatish tugmasi -->
    <div class="speaking-indicator" id="stopVoiceBtn" onclick="stopAllSpeech()">
      <span>⏹</span> Ovozni to'xtatish
    </div>

    <button class="nav-btn" onclick="clearHistoryConfirm()" title="Chatni tozalash">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </div>

  <!-- Chat Content (Matnlar saqlanib turadi) -->
  <div class="chat-container" id="chatContainer">
    <!-- Xabarlar dinamik chiqariladi va saqlanadi -->
  </div>

  <!-- Bottom Control Bar -->
  <div class="bottom-bar">

    <!-- Ovoz to'lqinlari -->
    <div class="wave-bars" id="waveBars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- Markaziy Mikrofon Bo'limi -->
    <div class="mic-section">
      <div class="mic-button-wrapper">
        <div class="mic-pulse-ring" id="pulseRing"></div>
        <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">
          <svg viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>

      <!-- Status -->
      <div class="mic-status-label" id="micStatus">Gapirish uchun bosing 🎙️</div>
    </div>

    <!-- Matn kiritish qatori -->
    <div class="input-row">
      <input type="text" id="textInput" placeholder="Yoki bu yerga yozing..." autocomplete="off" onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendTextMessage()" title="Yuborish">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#ffffff');
      tg.setBackgroundColor('#fffdf5');
    }

    function handleBack() {
      stopAllSpeech();
      if (tg?.close) tg.close();
      else window.history.back();
    }

    // Studiya sifatidagi o'g'il bola audio fayllari (Matn bilan 100% bir xil)
    const studioAudios = {
      welcome: "audio/welcome.mp3",
      qalesan: "audio/qalesan.mp3",
      mood_good: "audio/mood_good.mp3",
      name_ask: "audio/name_ask.mp3",
      grade_response: "audio/grade_response.mp3",
      thanks: "audio/thanks.mp3",
      goodbye: "audio/goodbye.mp3",
      startup: "audio/startup.mp3",
      founder: "audio/founder.mp3",
      english: "audio/english.mp3",
      english_correct: "audio/english_correct.mp3",
      en_apple: "audio/en_apple.mp3",
      en_cat: "audio/en_cat.mp3",
      en_dog: "audio/en_dog.mp3",
      en_book: "audio/en_book.mp3",
      en_house: "audio/en_house.mp3",
      en_sun: "audio/en_sun.mp3",
      en_water: "audio/en_water.mp3",
      en_car: "audio/en_car.mp3",
      en_bird: "audio/en_bird.mp3",
      en_star: "audio/en_star.mp3",
      en_moon: "audio/en_moon.mp3",
      animals: "audio/animals.mp3",
      math: "audio/math.mp3",
      math_correct: "audio/math_correct.mp3",
      math_retry: "audio/math_retry.mp3",
      space: "audio/space.mp3",
      planets: "audio/planets.mp3",
      merkuriy: "audio/merkuriy.mp3",
      venera: "audio/venera.mp3",
      earth: "audio/earth.mp3",
      mars: "audio/mars.mp3",
      jupiter: "audio/jupiter.mp3",
      saturn: "audio/saturn.mp3",
      uran: "audio/uran.mp3",
      neptune: "audio/neptune.mp3",
      tarbiya: "audio/tarbiya.mp3",
      tarbiya_correct: "audio/tarbiya_correct.mp3",
      cartoons: "audio/cartoons.mp3",
      riddle: "audio/riddle.mp3",
      general: "audio/general.mp3"
    };

    let activeAudioElement = null;
    let isCurrentlySpeaking = false;
    let currentPlayingBtn = null;

    // Suhbat tarixini saqlash tizimi (LocalStorage)
    const STORAGE_KEY = "kichikalloma_saved_chat_history";

    // Bola profilini eslab qolish
    let childProfile = {
      name: localStorage.getItem("child_name") || "",
      grade: localStorage.getItem("child_grade") || "",
      state: localStorage.getItem("chat_state") || "start"
    };

    function getSavedMessages() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : null;
      } catch (e) {
        return null;
      }
    }

    function saveMessageToStorage(msgObj) {
      const list = getSavedMessages() || [];
      list.push(msgObj);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function clearHistoryConfirm() {
      if (confirm("Hamma suhbat yozuvlarini tozalab yangidan boshlaymizmi?")) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem("child_name");
        localStorage.removeItem("child_grade");
        localStorage.removeItem("chat_state");
        childProfile = { name: "", grade: "", state: "start" };
        document.getElementById('chatContainer').innerHTML = '';
        renderWelcomeMessage(true);
      }
    }

    // Boshlang'ich salomlashuv
    function renderWelcomeMessage(playSound = false) {
      const welcomeText = "Assalomu alaykum, aziz do'stim! 🌟 Men Kichikalloma Aiman. Men sizga 8 ta sayyora, ingliz tili, matematika va odob-axloqni o'rgataman! Keling, avval tanishib olamiz — ismingiz nima?";
      addAiMessage(welcomeText, null, 'welcome', false);
      if (playSound) {
        setTimeout(() => {
          playStudioAudio('welcome');
        }, 500);
      }
    }

    // Sahifa har safar yuklanganda mini ilova 0 dan yangi boshlanadi
    window.addEventListener('DOMContentLoaded', () => {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem("child_name");
        localStorage.removeItem("child_grade");
        localStorage.removeItem("chat_state");
      } catch (e) {}
      childProfile = { name: "", grade: "", state: "start" };
      document.getElementById('chatContainer').innerHTML = '';
      renderWelcomeMessage(true);
    });

    // AI xabari yaratish va saqlash
    function addAiMessage(text, uzbekText, audioKey = 'general', shouldSave = true) {
      renderAiBubble(text, uzbekText, audioKey);

      if (shouldSave) {
        saveMessageToStorage({
          sender: 'ai',
          text: text,
          uzbekText: uzbekText,
          audioKey: audioKey,
          time: new Date().toLocaleTimeString()
        });
      }
    }

    function renderAiBubble(text, uzbekText, audioKey) {
      const container = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = 'msg-row';
      const id = 'trans_' + Math.random().toString(36).substr(2, 9);
      const audioBtnId = 'audio_' + Math.random().toString(36).substr(2, 9);

      row.innerHTML = `
        <div class="ai-avatar"></div>
        <div class="bubble ai-bubble">
          <div>${text.replace(/\n/g, '<br>')}</div>
          ${uzbekText ? `<div class="translation-box" id="${id}"><b>Tarjima / Izoh:</b><br>${uzbekText}</div>` : ''}
          <div class="bubble-actions">
            ${uzbekText ? `
              <button class="action-icon-btn" onclick="toggleTranslation('${id}')" title="Tarjima">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/>
                </svg>
              </button>
            ` : ''}
            <button class="action-icon-btn" id="${audioBtnId}" onclick="togglePlayAudio('${audioKey}', '${audioBtnId}', this.closest('.ai-bubble').querySelector('div').innerText)" title="Ovoz chiqarish yoki to'xtatish">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
            </button>
          </div>
        </div>
      `;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // Foydalanuvchi xabari qo'shish va saqlash
    function addUserMessage(text) {
      stopAllSpeech();

      renderUserBubble(text);
      saveMessageToStorage({
        sender: 'user',
        text: text,
        time: new Date().toLocaleTimeString()
      });

      // Moslashuvchan aqlli AI javobi
      setTimeout(() => {
        generateSmartAdaptiveReply(text);
      }, 500);
    }

    function renderUserBubble(text) {
      const container = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="bubble user-bubble">${text}</div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    // Tezkor savol yoki matn jo'natish
    function sendQuickMessage(text) {
      stopAllSpeech();
      addUserMessage(text);
    }

    function sendTextMessage() {
      const input = document.getElementById('textInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      addUserMessage(val);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendTextMessage();
      }
    }

    // 0 dan 100 gacha va undan katta sonlarni inglizcha so'zga aylantirish
    function numberToEnglish(num) {
      const ones = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
                    "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
      const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
      if (num >= 0 && num < 20) return ones[num];
      if (num < 100) {
        const rem = num % 10;
        return tens[Math.floor(num / 10)] + (rem > 0 ? "-" + ones[rem] : "");
      }
      if (num === 100) return "one hundred";
      if (num < 1000) {
        const h = Math.floor(num / 100);
        const rem = num % 100;
        return ones[h] + " hundred" + (rem > 0 ? " " + numberToEnglish(rem) : "");
      }
      return num.toString();
    }

    // O'zbekcha so'zlarni raqamga aylantirish (0 dan 100 gacha)
    function parseUzbekNumber(str) {
      if (!str) return null;
      const lower = str.toLowerCase().trim();
      const numDirect = lower.match(/\b\d+\b/);
      if (numDirect) return parseInt(numDirect[0]);
      
      const words = {
        "nol": 0, "bir": 1, "bitta": 1, "ikki": 2, "ikkita": 2, "uch": 3, "uchta": 3,
        "to'rt": 4, "tort": 4, "to'rtta": 4, "besh": 5, "beshta": 5,

    // Mukammal Ovoz Yozish (1 dan 30 sekundgacha sanash bilan)
    let isRecording = false;
    let recognition = null;
    let currentFinalTranscript = "";
    let currentInterimTranscript = "";
    let mediaStream = null;
    let recordingTimer = null;
    let recordingSecondsElapsed = 0;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initRecognition(langCode = 'uz-UZ') {
      if (!SpeechRecognition) return null;
      try {
        const rec = new SpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 3;
        rec.lang = langCode;

        rec.onresult = (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const trans = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              currentFinalTranscript += " " + trans;
            } else {
              interim += " " + trans;
            }
          }
          currentInterimTranscript = interim;
        };

        rec.onerror = (event) => {
          console.warn("Speech error:", event.error);
          if (event.error === 'language-not-supported' && langCode === 'uz-UZ') {
            recognition = initRecognition('ru-RU');
          }
        };

        rec.onend = () => {
          if (isRecording) {
            try {
              rec.start();
            } catch(e) {}
          }
        };

        return rec;
      } catch (e) {
        console.warn("SpeechRecognition init error:", e);
        return null;
      }
    }

    recognition = initRecognition('uz-UZ');

    function toggleVoiceInput() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      stopAllSpeech();
      currentFinalTranscript = "";
      currentInterimTranscript = "";
      recordingSecondsElapsed = 1;

      isRecording = true;
      const micBtn = document.getElementById('micBtn');
      const waveBars = document.getElementById('waveBars');
      const pulseRing = document.getElementById('pulseRing');

      micBtn.classList.add('recording');
      waveBars.classList.add('active');
      pulseRing.classList.add('active');
      document.getElementById('micStatus').textContent = `Sizni tinglayapman... (01/30) 🎙️`;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

      if (recognition) {
        try {
          recognition.start();
        } catch(e) {
          console.warn("recognition start error", e);
        }
      }

      // 01/30 dan 30/30 gacha oldinga sanash taymeri
      clearInterval(recordingTimer);
      recordingTimer = setInterval(() => {
        recordingSecondsElapsed++;
        if (recordingSecondsElapsed <= 30) {
          const formattedTime = String(recordingSecondsElapsed).padStart(2, '0') + '/30';
          document.getElementById('micStatus').textContent = `Sizni tinglayapman... (${formattedTime}) 🎙️`;
        } else {
          // 30 sekund to'ldi — to'xtatamiz
          clearInterval(recordingTimer);
          stopRecording();
        }
      }, 1000);
    }

    function stopRecording() {
      clearInterval(recordingTimer);
      if (!isRecording) return;
      isRecording = false;

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      const heard = (currentFinalTranscript + " " + currentInterimTranscript).trim();
      stopRecordingUI();
      if (heard) {
        addUserMessage(heard);
      } else {
        document.getElementById('micStatus').textContent = "Ovoz eshitilmadi. Qayta bosing yoki yozing! 🎙️";
        setTimeout(() => {
          if (!isRecording) document.getElementById('micStatus').textContent = "Gapirish uchun bosing 🎙️";
        }, 3500);
      }
    }

    function stopRecordingUI() {
      isRecording = false;
      clearInterval(recordingTimer);
      const micBtn = document.getElementById('micBtn');
      const waveBars = document.getElementById('waveBars');
      const pulseRing = document.getElementById('pulseRing');

      micBtn.classList.remove('recording');
      waveBars.classList.remove('active');
      pulseRing.classList.remove('active');
      document.getElementById('micStatus').textContent = "Gapirish uchun bosing 🎙️";
    }

    // AI Ovozini boshqarish
    function stopAllSpeech() {
      if (activeAudioElement) {
        activeAudioElement.pause();
        activeAudioElement.currentTime = 0;
        activeAudioElement = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isCurrentlySpeaking = false;
      document.getElementById('stopVoiceBtn').classList.remove('active');
      if (currentPlayingBtn) {
        currentPlayingBtn.classList.remove('playing');
        currentPlayingBtn = null;
      }
    }

    function togglePlayAudio(audioKey, btnId, customText = "") {
      if (isCurrentlySpeaking && currentPlayingBtn?.id === btnId) {
        stopAllSpeech();
        return;
      }
      if (audioKey === 'custom') {
        speakCustomText(customText, btnId);
      } else {
        playStudioAudio(audioKey, btnId);
      }
    }

    function speakCustomText(text, btnId = null) {
      stopAllSpeech();
      if (!('speechSynthesis' in window)) return;
      const cleanText = text.replace(/[*_~`#🍎🖐️🌟😊👏💙🪐🎨📚💪👋✨🎙️👂]/g, '').trim();
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = 'uz-UZ';
      utter.rate = 0.95;
      utter.pitch = 1.05;

      utter.onstart = () => {
        isCurrentlySpeaking = true;
        document.getElementById('stopVoiceBtn').classList.add('active');
        if (btnId) {
          const btn = document.getElementById(btnId);
          if (btn) {
            btn.classList.add('playing');
            currentPlayingBtn = btn;
          }
        }
      };
      utter.onend = () => {
        stopAllSpeech();
      };
      utter.onerror = () => {
        stopAllSpeech();
      };

      window.speechSynthesis.speak(utter);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function playStudioAudio(audioKey, btnId = null) {
      if (audioKey === 'custom') return;
      stopAllSpeech();

      const audioSrc = studioAudios[audioKey] || studioAudios['general'];
      const audio = new Audio(audioSrc);
      activeAudioElement = audio;

      audio.play().then(() => {
        isCurrentlySpeaking = true;
        document.getElementById('stopVoiceBtn').classList.add('active');
        if (btnId) {
          const btn = document.getElementById(btnId);
          if (btn) {
            btn.classList.add('playing');
            currentPlayingBtn = btn;
          }
        }
      }).catch(err => {
        console.log("Audio play err:", err);
      });

      audio.onended = () => {
        stopAllSpeech();
      };

      audio.onerror = () => {
        stopAllSpeech();
      };

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function toggleTranslation(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('show');
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }
